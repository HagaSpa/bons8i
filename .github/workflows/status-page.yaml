name: status-page

on:
  push:
    branches: [main]
    paths: ["web/status-page/**", ".github/workflows/status-page.yaml"]
  pull_request:
    paths: ["web/status-page/**", ".github/workflows/status-page.yaml"]

env:
  IMAGE: ghcr.io/hagaspa/bons8i/status-page

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'web/status-page/**'

  check-frontend:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/status-page/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/status-page/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  check-server:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/status-page/server
    steps:
      - uses: actions/checkout@v7

      # Dockerfile の rust と一致させる
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/status-page/server

      # rust-embed が dist/ をコンパイル時に要求する（中身は不要）
      - run: mkdir -p ../frontend/dist

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # arm64 ネイティブランナー（public リポは無料）。QEMU 不要
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # PR はビルド検証のみ、main への push だけ ghcr へ push
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: web/status-page
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [changes, build, check-frontend, check-server]
    if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image tag to built SHA
        working-directory: clusters/pi/status-page
        run: kustomize edit set image ${{ env.IMAGE }}:${{ github.sha }}

      - name: Create deploy PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="deploy/status-page-${GITHUB_SHA::7}"
          git switch -c "$branch"
          git add clusters/pi/status-page/kustomization.yaml
          git commit -m "chore(status-page): deploy ${GITHUB_SHA::7}"
          git push origin "$branch"
          gh label create deploy --color 0E8A16 --description "CI-generated deploy PR" --force
          gh pr create \
            --title "chore(status-page): deploy ${GITHUB_SHA::7}" \
            --body "Auto-generated by CI. Image: \`${IMAGE}:${GITHUB_SHA}\`" \
            --label deploy
          gh pr merge --squash --delete-branch "$branch"
